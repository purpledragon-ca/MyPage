<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>技能树 Skill Tree · Purple Dragon</title>
  <link rel="stylesheet" href="../css/theme.css"/>
  <link rel="stylesheet" href="../css/skilltree.css"/>
  <!-- 你的导航样式（若有） -->
  <link rel="stylesheet" href="../css/partials.css"/>
</head>

<body>
  <!-- 1) 把 include 占位 放到 body 里最顶部 -->
  <div id="site-header" data-include="../partials/header.html"></div>
  <section class="hero">
    <div class="wrap">
      <h1 class="title">技能树 Skill Tree</h1>
      <p class="subtitle">支持折叠/搜索；叶子节点为按钮，点击跳转到项目。</p>
      <div class="toolbar">
        <div class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-4.3-4.3m1.3-4.2a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="st-search" type="search" placeholder="搜索技能 / 节点…（Esc 清空）" autocomplete="off">
        </div>
        <button class="btn" id="st-expand">展开全部</button> 
        <button class="btn" id="st-collapse">折叠全部</button> 
        <button class="btn btn-primary" id="st-clear">清除筛选</button> 
      </div>
    </div>
  </section>

  <main class="wrap">
    
    <div class="columns" id="st-columns">
      <!-- 树卡片将插入到这里 -->
    </div>
    <div class="footer">提示：叶子节点可写成 "名称 [token]" 的 Markdown 格式，token 将用作 <code>?skill=</code>。</div>
  </main>

  <script type="text/markdown" id="skilltree-md">
# 机器人框架
- ROS 生态
  - ROS [ros]
  - ROS2 [ros2]
  - MoveIt [moveit]
- 仿真平台
  - Isaac Sim [isaacsim]
  - Isaac Lab [isaaclab]
- 机器人硬件
  - SO-ARM101 [so101]
  - ABB [rapid]
  - FANUC [fanuc]
- 控制
  - PID [pid]
  - MPC [mpc]
  - RL [rl]

# 计算机视觉
- 视觉算法
  - OpenCV [cv2]
  - CNN [cnn]
  - YOLO v8 [yolov8]
  - SAM (Segment Anything) [sam]
- 标定
  - 相机标定 [calibration]
  - 相机-LiDAR 联合标定 [calibration]
  - AprilTag 定位 [apriltag]
- 位姿估计
  - 6D 位姿估计 [pose_estimation]
  - 抓取 [grasping]

# 传感器融合  
- 相机
  - RGB 相机 [camera]
  - 红外相机 [infrared]
  - RGB-D 相机 [rgbd]
- LiDAR
  - 2D LiDAR [lidar]
  - 3D LiDAR [3d_lidar]
- 触觉感知
  - GelSight Mini [tactile]
  - 视觉-触觉融合 [tactile]

# AI & 机器学习
- 深度学习
  - CNN 架构 [cnn]
  - Transformer [transformer]
  - U-Net [unet]
- 强化学习
  - 策略学习 [rl]
  - Isaac Lab 训练 [isaaclab]
- 经典机器学习
  - K-Means [ml]
  - Naive Bayes [ml]
  - Decision Tree [ml]
  - Random Forest [ml]

# 编程 & 工具
- 编程语言
  - Python [python]
  - C++ [c++]
  - C [c]
  - RAPID [rapid]
- 开发工具
  - Git / GitHub [git]
  - Docker [docker]
  - CMake [cmake]
- 标注工具
  - LabelMe [labelme]
  - 数据采集 [data_collect]
  </script>

  <script src="../js/skilltree.js"> </script>
  <script src="../js/include.js"> </script>
</body>
</html>
